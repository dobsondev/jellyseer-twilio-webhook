name: Build and Test Application

on:
  pull_request: 
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Run Postman Collection Tests
    runs-on: ubuntu-latest
    env:
      TWILIO_TEST_ACCOUNT_SID: ${{ secrets.TWILIO_TEST_ACCOUNT_SID }}
      TWILIO_TEST_AUTH_TOKEN: ${{ secrets.TWILIO_TEST_AUTH_TOKEN }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run `docker compose build --no-cache`
      run: |
        docker compose -f docker-compose.github.yml build --no-cache

    - name: Run `docker compose up`
      run: |
        docker compose -f docker-compose.github.yml up -d

    - name: Wait for service to be ready
      run: |
        for i in $(seq 1 30); do
          curl -sf http://localhost:5050/ && exit 0
          sleep 1
        done
        echo "Service did not become ready in time"
        docker compose -f docker-compose.github.yml logs
        exit 1

    - name: Install Newman
      run: |
        sudo npm install -g newman

    - name: Run Postman Collection tests with Newman
      run: |
        newman run postman/postman_collection.json -e postman/github.postman_environment.json

    - name: Run `docker compose down`
      run: |
        docker compose -f docker-compose.github.yml down
